<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Một điều nhỏ muốn gửi cậu 💗</title>
<meta name="theme-color" content="#ff6f91" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#fff5f8 0,#ffe2eb 35%,#ffd2df 100%);overflow-x:hidden}
  body{min-height:100vh;display:grid;place-items:center;padding:20px;color:#5a2130}
  .card{width:min(92vw,720px);background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:0 24px 70px rgba(150,45,78,.18);padding:26px;text-align:center;position:relative;overflow:hidden}
  .intro{padding:34px 10px 28px;transition:.5s ease}
  h1{font-size:clamp(28px,6vw,52px);margin:0 0 14px;line-height:1.05}
  .sub{font-size:clamp(16px,3.6vw,20px);opacity:.78;margin:0 0 26px}
  button{appearance:none;border:0;border-radius:999px;padding:14px 24px;font-weight:800;font-size:18px;cursor:pointer;background:linear-gradient(135deg,#ff4f7d,#ff87a7);color:white;box-shadow:0 10px 24px rgba(255,79,125,.32);transition:.18s transform,.18s box-shadow}
  button:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 14px 30px rgba(255,79,125,.38)}
  button:active{transform:scale(.98)}
  .surprise{display:none;opacity:0;transform:scale(.9) translateY(10px)}
  .surprise.show{display:block;animation:pop .72s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes pop{to{opacity:1;transform:scale(1) translateY(0)}}
  .photo-wrap{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 12px 34px rgba(100,30,55,.18)}
  .photo{display:block;width:100%;height:auto}
  .caption{margin:20px auto 4px;font-size:clamp(19px,4.4vw,30px);line-height:1.35;font-weight:850;max-width:640px}
  .caption strong{color:#ff4778}
  .tiny{font-size:14px;opacity:.62;margin-top:10px}
  .heart{position:fixed;left:50%;top:55%;pointer-events:none;z-index:999;font-size:24px;animation:fly 2.8s ease-out forwards;will-change:transform,opacity}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.6) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% - var(--y))) scale(var(--s)) rotate(var(--r));opacity:0}}
  .pulse{animation:pulse 1.3s ease-in-out infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
</style>
</head>
<body>
  <main class="card">
    <section class="intro" id="intro">
      <div class="pulse" style="font-size:64px;margin-bottom:12px">💌</div>
      <h1>Có một điều nhỏ muốn gửi cậu</h1>
      <p class="sub">Bấm vào đây nha, có bất ngờ một chút 💗</p>
      <button id="openBtn">Mở bất ngờ 💖</button>
    </section>

const hearts=['💗','💖','💕','💘','💝','🌸'];
function burst(count=60){
  for(let i=0;i<count;i++){
    const e=document.createElement('div');
    e.className='heart';
    e.textContent=hearts[Math.floor(Math.random()*hearts.length)];
    e.style.setProperty('--x', (Math.random()*900-450)+'px');
    e.style.setProperty('--y', (220+Math.random()*650)+'px');
    e.style.setProperty('--s', (.8+Math.random()*1.8).toFixed(2));
    e.style.setProperty('--r', (Math.random()*360-180)+'deg');
    e.style.left=(10+Math.random()*80)+'vw';
    e.style.top=(55+Math.random()*18)+'vh';
    e.style.animationDelay=(Math.random()*.35)+'s';
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),3400);
  }
}
btn.addEventListener('click',()=>{
  intro.style.display='none';
  surprise.classList.add('show');
  burst(80);
  setTimeout(()=>burst(35),700);
});
</script>
</body>
