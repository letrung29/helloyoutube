<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Gửi Em Đông</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0b0d10;--panel:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);--text:#f4f5f7;--muted:#9aa0aa}
html,body{margin:0;min-height:100%;background:#0b0d10;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -10%,#252a31 0,#15181d 35%,#0b0d10 72%)}
.shell{width:min(860px,100%);text-align:center}
.card{position:relative;overflow:hidden;padding:clamp(24px,4vw,42px);border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.42);backdrop-filter:blur(14px)}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 10%,rgba(255,255,255,.035) 45%,transparent 70%);transform:translateX(-120%);animation:sheen 8s ease-in-out infinite}
@keyframes sheen{0%,70%,100%{transform:translateX(-120%)}85%{transform:translateX(120%)}}
.intro{transition:opacity .45s ease,transform .45s ease}
h1{margin:0 0 10px;font-size:clamp(34px,7vw,64px);letter-spacing:.04em;line-height:1;font-weight:850}
.sub{margin:0 auto 26px;max-width:600px;color:var(--muted);font-size:clamp(14px,2vw,17px);line-height:1.6}
button{border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:14px 24px;background:linear-gradient(180deg,#f3f4f6,#b8bdc5);color:#111;font-weight:800;font-size:15px;letter-spacing:.02em;cursor:pointer;box-shadow:0 12px 26px rgba(0,0,0,.28);transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}
button:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(0,0,0,.34);filter:brightness(1.04)}button:active{transform:translateY(0) scale(.985)}
.viewer{display:none;margin-top:28px}
.frame{position:relative;display:grid;place-items:center;min-height:280px;border-radius:22px;overflow:hidden;background:#0d1014;border:1px solid var(--line);box-shadow:0 20px 55px rgba(0,0,0,.38)}
.frame img{display:block;max-width:100%;max-height:64vh;object-fit:contain;opacity:0;transform:scale(.985);filter:blur(6px);transition:opacity .48s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1),filter .5s ease}
.frame img.show{opacity:1;transform:scale(1);filter:blur(0)}
.caption{margin:20px auto 8px;max-width:680px;min-height:62px;font-size:clamp(18px,3vw,26px);line-height:1.45;font-weight:760;opacity:0;transform:translateY(8px);transition:opacity .42s ease .08s,transform .42s ease .08s}
.caption.show{opacity:1;transform:translateY(0)}
.counter{color:var(--muted);font-size:13px;margin-bottom:18px;letter-spacing:.08em;text-transform:uppercase}
.end{display:none;padding:18px 4px 4px;opacity:0;transform:translateY(10px);transition:opacity .65s ease,transform .65s ease}
.end.show{opacity:1;transform:translateY(0)}
.endText{font-size:clamp(21px,4vw,36px);font-weight:850;line-height:1.35;letter-spacing:.015em}
.hint{margin-top:14px;color:#737984;font-size:12px}
@media(max-width:600px){body{padding:12px}.card{border-radius:22px;padding:22px 14px 28px}.frame{border-radius:16px;min-height:220px}.frame img{max-height:58vh}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell">
  <section class="card">
    <div class="intro" id="intro">
      <h1>GỬI EM ĐÔNG.</h1>
      <p class="sub">Một vài tấm ảnh, một vài lời chúc. Nhấn nút để xem lần lượt.</p>
    </div>
    <button id="nextBtn">BẮT ĐẦU</button>
    <div class="viewer" id="viewer">
      <div class="frame"><img id="photo" alt="Ảnh kỷ niệm"></div>
      <div class="caption" id="caption"></div>
      <div class="counter" id="counter"></div>
    </div>
    <div class="end" id="end">
      <div class="endText">DON'T CRY ANYMORE, GO MAKE ANOTHER FRESH CHANNEL — GOOD LUCK, MY LITTLE BROTHER.</div>
    </div>
    <div class="hint">Click để chuyển sang ảnh tiếp theo</div>
  </section>
</main>

const btn=document.getElementById('nextBtn'),viewer=document.getElementById('viewer'),photo=document.getElementById('photo'),caption=document.getElementById('caption'),counter=document.getElementById('counter'),end=document.getElementById('end'),intro=document.getElementById('intro');
let i=-1,finished=false,busy=false;
slides.forEach(x=>{const im=new Image();im.src=x.src});
function showSlide(n){
  busy=true; end.classList.remove('show'); end.style.display='none'; viewer.style.display='block';
  photo.classList.remove('show'); caption.classList.remove('show');
  setTimeout(()=>{
    photo.src=slides[n].src; caption.textContent=slides[n].message; counter.textContent=`ẢNH ${n+1} / ${slides.length}`;
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{photo.classList.add('show');caption.classList.add('show');busy=false})});
  },220);
  btn.textContent=n===slides.length-1?'XEM LỜI CUỐI':'ẢNH TIẾP THEO';
}
function reset(){i=-1;finished=false;viewer.style.display='none';end.style.display='none';end.classList.remove('show');intro.style.opacity='1';intro.style.transform='none';btn.textContent='BẮT ĐẦU'}
btn.addEventListener('click',()=>{
  if(busy)return;
  if(finished){reset();return}
  if(i<slides.length-1){i++;intro.style.opacity=i===0?'.38':'0';intro.style.transform='translateY(-6px)';showSlide(i)}
  else{viewer.style.display='none';end.style.display='block';requestAnimationFrame(()=>end.classList.add('show'));btn.textContent='XEM LẠI TỪ ĐẦU';finished=true}
});
